<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Gestión de Gastos</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="../src/styles/layout/sidebar.css">
    <link rel="stylesheet" href="../src/styles/layout/header.css">
</head>
<body>
    <div id="app-loading" class="app-loading" aria-live="polite">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <div class="app-shell d-flex">
        <aside class="app-sidebar" aria-label="Navegación principal">
            <div class="app-sidebar__brand">
                <span class="app-sidebar__logo" aria-hidden="true">GE</span>
                <div>
                    <p class="app-sidebar__title">Gestión de Gastos</p>
                    <p class="app-sidebar__subtitle">Panel corporativo</p>
                </div>
            </div>

            <nav class="app-sidebar__nav">
                <a href="dashboard.html" class="app-sidebar__link is-active" aria-current="page">
                    Dashboard
                </a>
                <a href="#" class="app-sidebar__link">Mis Gastos</a>
                <a href="#" class="app-sidebar__link">Aprobaciones</a>
                <a href="#" class="app-sidebar__link">Reportes</a>
            </nav>

            <p class="app-sidebar__footer">Sistema on-premise</p>
        </aside>

        <div class="app-main d-flex flex-column flex-grow-1">
            <header class="app-header">
                <div>
                    <p id="user-welcome" class="app-header__welcome">Bienvenido</p>
                    <p id="user-meta" class="app-header__meta">Verificando sesión...</p>
                </div>

                <div class="app-header__actions">
                    <button
                        type="button"
                        id="logout-button"
                        class="btn btn-outline-danger btn-sm app-header__logout"
                    >
                        Cerrar Sesión
                    </button>
                </div>
            </header>

            <main class="app-content">
                <section class="app-content__card">
                    <h1 class="app-content__title">Panel principal</h1>
                    <p class="app-content__text">
                        Bienvenido al sistema de gestión de gastos empresariales.
                        Utilice el menú lateral para acceder a los módulos disponibles.
                    </p>
                </section>
            </main>
        </div>
    </div>

    <script src="../src/scripts/pages/dashboard/dashboard.page.js" defer></script>
</body>
</html>
