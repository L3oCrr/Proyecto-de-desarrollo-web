<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Gestión de Gastos</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="../src/styles/pages/login.css">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card" aria-labelledby="login-title">
            <header class="login-card__header">
                <div class="login-card__brand" aria-hidden="true">GE</div>
                <h1 id="login-title" class="login-card__title">Gestión de Gastos</h1>
                <p class="login-card__subtitle">Acceso corporativo al sistema</p>
            </header>

            <div class="login-card__body">
                <div
                    id="login-error"
                    class="alert alert-danger login-alert"
                    role="alert"
                    aria-live="assertive"
                ></div>

                <div
                    id="login-success"
                    class="alert alert-success login-alert"
                    role="status"
                    aria-live="polite"
                ></div>

                <form id="login-form" class="login-form" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="usuario@empresa.local"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" id="login-submit" class="btn btn-primary w-100">
                        Iniciar Sesión
                    </button>
                </form>

                <p class="login-footer">
                    Sistema interno on-premise &middot; Uso exclusivo de personal autorizado
                </p>
            </div>
        </section>
    </main>

    <script src="../src/scripts/pages/auth/login.page.js" defer></script>
</body>
</html>
